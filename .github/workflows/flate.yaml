---
name: Flate

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test ${{ matrix.cluster }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cluster:
        - production
        - staging
        - fallback
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup flate
      uses: home-operations/flate/action@v0.6.5
    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --registry-config "${{ runner.temp }}/registry-config.json" --username "${{ github.actor }}" --password-stdin
    - name: Build and validate
      run: >-
        flate test all
        --path base/${{ matrix.cluster }}
        --registry-config "${{ runner.temp }}/registry-config.json"
        --api-versions policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1
