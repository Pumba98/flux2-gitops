---
name: Flux Local

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test ${{ matrix.cluster }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cluster:
        - production
        - staging
        - fallback
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Flux CLI
      uses: fluxcd/flux2/action@v2.10.0
    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
    - name: Build and validate
      uses: allenporter/flux-local/action/test@8.4.0
      with:
        path: base/${{ matrix.cluster }}
        enable-helm: true
        sources: flux-system
        api-versions: policy/v1/PodDisruptionBudget,monitoring.coreos.com/v1
