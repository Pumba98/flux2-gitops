---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: myfinnest-app
  namespace: flux-system
spec:
  path: ./apps/myfinnest
  targetNamespace: selfhosted
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: myfinnest
      namespace: selfhosted
  dependsOn:
    - name: kopiur-repository
    - name: envoy-gateway-app
    - name: longhorn-app
    - name: kube-prometheus-stack-app
