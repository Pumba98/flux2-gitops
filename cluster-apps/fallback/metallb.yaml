---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-app
  namespace: flux-system
spec:
  patches:
    - target:
        kind: HelmRelease
        name: metallb
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: metallb
        spec:
          # hostNetwork pod on a single node can't surge
          postRenderers:
            - kustomize:
                patches:
                  - target:
                      kind: Deployment
                      name: metallb-frr-k8s-statuscleaner
                    patch: |-
                      - op: replace
                        path: /spec/strategy
                        value:
                          type: Recreate
