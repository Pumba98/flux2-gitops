---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-app
  namespace: flux-system
spec:
  patches:
    - target:
        kind: HelmRelease
        name: longhorn
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: longhorn
        spec:
          values:
            persistence:
              defaultClassReplicaCount: 1
            defaultSettings:
              nodeDrainPolicy: always-allow
            # No backups on the fallback cluster
            defaultBackupStore:
              backupTarget: ""
              backupTargetCredentialSecret: ""
    - target:
        kind: StorageClass
        name: longhorn-backup
      patch: |-
        kind: StorageClass
        apiVersion: storage.k8s.io/v1
        metadata:
          name: longhorn-backup
        parameters:
          numberOfReplicas: "1"
          recurringJobSelector: '[ { "name":"snapshot-6h", "isGroup":false } ]'
    - target:
        kind: StorageClass
        name: longhorn-xfs
      patch: |-
        kind: StorageClass
        apiVersion: storage.k8s.io/v1
        metadata:
          name: longhorn-xfs
        parameters:
          numberOfReplicas: "1"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-configs
  namespace: flux-system
spec:
  # No envoy gateway on the fallback cluster.
  dependsOn:
    - name: longhorn-app
  patches:
    - target:
        kind: HTTPRoute
        name: longhorn
      patch: |-
        $patch: delete
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: longhorn
    # No backups on the fallback cluster.
    - target:
        kind: RecurringJob
        name: backup-daily
      patch: |-
        $patch: delete
        apiVersion: longhorn.io/v1beta2
        kind: RecurringJob
        metadata:
          name: backup-daily
