---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: descheduler-app
  namespace: flux-system
spec:
  patches:
    # the only node is a control plane
    - target:
        kind: HelmRelease
        name: descheduler
      patch: |-
        - op: remove
          path: /spec/values/deschedulerPolicy/nodeSelector
