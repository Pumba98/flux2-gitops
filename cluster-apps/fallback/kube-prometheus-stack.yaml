---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-app
  namespace: flux-system
spec:
  # No envoy gateway and no authelia on the fallback cluster.
  dependsOn:
    - name: longhorn-app
  patches:
    - target:
        kind: HTTPRoute
      patch: |-
        $patch: delete
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: placeholder
    - target:
        kind: HelmRelease
        name: kube-prometheus-stack
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kube-prometheus-stack
        spec:
          values:
            grafana:
              grafana.ini:
                auth:
                  disable_login_form: false
                  oauth_auto_login: false
                auth.generic_oauth:
                  enabled: false
            prometheus:
              prometheusSpec:
                externalLabels:
                  cluster: ${CLUSTER_NAME}
