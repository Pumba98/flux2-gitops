---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blocky-app
  namespace: flux-system
spec:
  dependsOn:
    - name: metallb-app
  patches:
    - target:
        kind: HelmRelease
        name: blocky
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: blocky
        spec:
          dependsOn:
            - name: metallb
              namespace: metallb-system
    - target:
        kind: HelmRelease
        name: blocky
      patch: |-
        - op: remove
          path: /spec/values/route
