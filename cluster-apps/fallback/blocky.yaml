---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blocky-app
  namespace: flux-system
spec:
  dependsOn:
    - name: metallb-app
  patches:
    - target:
        kind: HelmRelease
        name: blocky
      patch: |-
        - op: remove
          path: /spec/values/route
