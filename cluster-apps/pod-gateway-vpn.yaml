---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pod-gateway-vpn-app
  namespace: flux-system
spec:
  path: ./apps/pod-gateway-vpn
  targetNamespace: pod-gateway-system
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: pod-gateway-vpn
      namespace: pod-gateway-system
