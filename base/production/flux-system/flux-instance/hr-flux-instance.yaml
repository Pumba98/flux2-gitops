---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: flux-instance
      version: 0.62.1
      sourceRef:
        kind: HelmRepository
        name: fluxcd-charts
        namespace: flux-system
  dependsOn:
    - name: flux-operator
      namespace: flux-system
  values:
    instance:
      kustomize:
        patches:
          - target:
              kind: Deployment
              name: helm-controller
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=DefaultToRetryOnFailure=true,CancelHealthCheckOnNewRevision=true
      sync:
        kind: GitRepository
        url: ssh://git@github.com/Pumba98/flux2-gitops
        path: base/production
        ref: refs/heads/main
        provider: generic
        pullSecret: flux-system
