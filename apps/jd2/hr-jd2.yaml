---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jd2
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: jlesage/jdownloader-2
              tag: v26.11.1@sha256:2619aae2d501abfcaba01862882716840068fcc25b4584b656ff0cc16d76f2c0
              pullPolicy: IfNotPresent
            env:
              KEEP_APP_RUNNING: true
              JDOWNLOADER_MAX_MEM: 1G
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      main:
        controller: main
        ports:
          http:
            port: 5800
    route:
      main:
        hostnames:
          - "jd2.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
          - name: external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: http
    persistence:
      config:
        existingClaim: jd2-config
        globalMounts:
          - path: "/config"
      output:
        existingClaim: jd2-output
        globalMounts:
          - path: "/output"
