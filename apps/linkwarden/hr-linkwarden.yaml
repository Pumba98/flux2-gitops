---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  dependsOn:
    - name: linkwarden-postgresql
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
            env:
              NEXTAUTH_URL: https://linkwarden.${SECRET_DOMAIN}/api/v1/auth
              DATABASE_URL: "postgres://linkwarden:$(DB_PASSWORD)@linkwarden-postgresql-primary:5432/linkwarden"
              NEXT_PUBLIC_DISABLE_REGISTRATION: true
              NEXT_PUBLIC_CREDENTIALS_ENABLED: false
              NEXT_PUBLIC_AUTHELIA_ENABLED: true
              AUTHELIA_WELLKNOWN_URL: https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration
            envFrom:
              - secretRef:
                  name: linkwarden
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    route:
      main:
        annotations:
          external-dns.kubernetes.io/target: "${SECRET_GATEWAY}"
        hostnames:
          - "linkwarden.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
          - name: external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: http
    persistence:
      data:
        existingClaim: linkwarden-data
        globalMounts:
          - path: /data/data
