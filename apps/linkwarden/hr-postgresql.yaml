---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden-postgresql
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      primary:
        type: statefulset
        # initContainers:
        #   # Init Container for Major PostgreSQL Upgrades, not needed permanently
        #   pgautoupgrade:
        #     image:
        #       repository: pgautoupgrade/pgautoupgrade
        #       tag: 18-trixie
        #     env:
        #       PGAUTO_ONESHOT: "yes"
        #       POSTGRES_DB: linkwarden
        #       POSTGRES_PASSWORD: {valueFrom: {secretKeyRef: {name: linkwarden, key: DB_PASSWORD}}}
        containers:
          postgresql:
            image:
              repository: public.ecr.aws/docker/library/postgres
              tag: 18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
            env:
              POSTGRES_DB: linkwarden
              POSTGRES_USER: linkwarden
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden
                    key: DB_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 750m
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                port: 5432
              readiness:
                enabled: true
                port: 5432
          metrics:
            image:
              repository: quay.io/prometheuscommunity/postgres-exporter
              tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
            env:
              DATA_SOURCE_URI: localhost:5432/postgres?sslmode=disable
              DATA_SOURCE_USER: linkwarden
              DATA_SOURCE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden
                    key: DB_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 150m
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                port: 9187
              readiness:
                enabled: true
                port: 9187
    service:
      primary:
        controller: primary
        ports:
          postgresql:
            port: 5432
      metrics:
        controller: primary
        ports:
          metrics:
            port: 9187
    persistence:
      data:
        existingClaim: linkwarden-postgresql
        globalMounts:
          - path: /var/lib/postgresql
            subPath: data
    serviceMonitor:
      main:
        enabled: true
        serviceName: linkwarden-postgresql-metrics
        endpoints:
          - port: metrics
