---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-backup
  accessModes:
  - ReadWriteOnce
  # dataSourceRef:
  #   apiGroup: kopiur.home-operations.com
  #   kind: Restore
  #   name: linkwarden-data
  resources:
    requests:
      storage: 2Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: linkwarden-data
spec:
  repository:
    kind: ClusterRepository
    name: primary
  credentialProjection:
    enabled: true
  sources:
  - pvc:
      name: linkwarden-data
  retention:
    keepDaily: 7
    keepWeekly: 1
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: linkwarden-data
spec:
  policyRef:
    name: linkwarden-data
  schedule:
    cron: "30 5 * * *"
    runOnCreate: false
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: linkwarden-data
spec:
  repository:
    kind: ClusterRepository
    name: primary
  source:
    fromPolicy:
      name: linkwarden-data
  target:
    populator: {}
  credentialProjection:
    enabled: true
  policy:
    onMissingSnapshot: Continue
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
