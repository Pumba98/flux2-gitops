---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: myfinnest
spec:
  interval: 5m
  chart:
    spec:
      chart: myfinnest
      version: 2.4.0
      sourceRef:
        kind: HelmRepository
        name: myfinnest-charts
        namespace: flux-system
  dependsOn:
    - name: envoy-gateway
      namespace: networking
    - name: longhorn
      namespace: longhorn-system
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            env:
              AUTH_MODE: oidc
              OIDC_CLIENT_ID: zjIwLBQHXEJRJskQny5dwTPkgTJe7DO16~8CSg_.4wwn3.rh8o2mWWeu.U0wGfczdjAG6~uM
              OIDC_ISSUER_URL: https://auth.${SECRET_DOMAIN}
              OIDC_REDIRECT_URI: https://myfinnest.${SECRET_DOMAIN}/auth/callback
            envFrom:
              - secretRef:
                  name: myfinnest
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
      sync-worker:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            envFrom:
              - secretRef:
                  name: myfinnest-sync-worker
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
    secrets:
      app-secrets:
        enabled: false
      sync-secrets:
        enabled: false
    route:
      main:
        hostnames:
          - "myfinnest.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: http
    persistence:
      data:
        existingClaim: myfinnest-data
