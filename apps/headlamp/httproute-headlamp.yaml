---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  annotations:
    external-dns.alpha.kubernetes.io/target: "${SECRET_GATEWAY}"
spec:
  parentRefs:
  - name: external
    namespace: networking
  hostnames:
  - "headlamp.${SECRET_DOMAIN}"
  rules:
  - backendRefs:
    - name: headlamp
      port: 80
