---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 5m
  dependsOn:
    - name: csi-driver-smb
      namespace: kube-system
    - name: envoy-gateway
      namespace: networking
    - name: longhorn
      namespace: longhorn-system
    - name: immich-redis
    - name: immich-postgresql
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.4@sha256:f6475c58b07a8d89ec845aa8782731d36656c3c17d943e0a101dc6ed99a2e53f
            env:
              DB_HOSTNAME: immich-postgresql-primary
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD: "${SECRET_IMMICH_DB_PASSWORD}"
              REDIS_HOSTNAME: immich-redis-master
              IMMICH_LOG_LEVEL: warn
              IMMICH_HELMET_FILE: "true"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      main:
        controller: main
        ports:
          http:
            port: 2283
    route:
      main:
        annotations:
          external-dns.kubernetes.io/target: "${SECRET_GATEWAY}"
        hostnames:
        - "immich.${SECRET_DOMAIN}"
        parentRefs:
        - name: internal
          namespace: networking
        - name: external
          namespace: networking
        rules:
        - backendRefs:
          - identifier: main
            port: http
    persistence:
      data:
        existingClaim: immich
        globalMounts:
          - path: /usr/src/app/upload
