---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-postgresql
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      primary:
        type: statefulset
        # initContainers:
        #   # Init Container for Major PostgreSQL Upgrades, not needed permanently
        #   pgautoupgrade:
        #     image:
        #       repository: ghcr.io/pumba98/pgautoupgrade-vchord
        #       tag: 18-debian-v0.5.3
        #     env:
        #       PGAUTO_ONESHOT: "yes"
        #       POSTGRES_USER: immich
        #       POSTGRES_DB: immich
        #       POSTGRES_PASSWORD: {valueFrom: {secretKeyRef: {name: immich-secrets, key: DB_PASSWORD}}}
        containers:
          postgresql:
            image:
              repository: ghcr.io/immich-app/postgres
              tag: 18-vectorchord1.1.1@sha256:f7388adc1e3414800a71506528917f4f5615249f5fe7a872b1e1431e01b72ad7
            env:
              POSTGRES_DB: immich
              POSTGRES_USER: immich
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secrets
                    key: DB_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                cpu: 750m
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                port: 5432
              readiness:
                enabled: true
                port: 5432
          metrics:
            image:
              repository: quay.io/prometheuscommunity/postgres-exporter
              tag: v0.21.1@sha256:a88794758ad461c75f3825b51cde4bde730bdff04b3b24d00efe14217e41f615
            env:
              DATA_SOURCE_URI: localhost:5432/postgres?sslmode=disable
              DATA_SOURCE_USER: immich
              DATA_SOURCE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: immich-secrets
                    key: DB_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 150m
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                port: 9187
              readiness:
                enabled: true
                port: 9187
    service:
      primary:
        controller: primary
        ports:
          postgresql:
            port: 5432
      metrics:
        controller: primary
        ports:
          metrics:
            port: 9187
    persistence:
      data:
        existingClaim: immich-postgresql-data
        globalMounts:
          - path: /var/lib/postgresql
            subPath: data
    serviceMonitor:
      main:
        enabled: true
        serviceName: immich-postgresql-metrics
        endpoints:
          - port: metrics
