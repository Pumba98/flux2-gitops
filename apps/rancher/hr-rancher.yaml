---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
spec:
  interval: 5m
  chart:
    spec:
      chart: rancher
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: rancher-latest
        namespace: flux-system
  dependsOn:
    - name: envoy-gateway
      namespace: networking
  values:
    replicas: 1
    hostname: rancher.${SECRET_DOMAIN}
    # Exposed via httproute
    tls: external
    ingress:
      enabled: false
    bootstrapPassword: "${SECRET_RANCHER_ADMIN_PASSWORD}"
