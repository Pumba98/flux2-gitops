---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 5m
  chart:
    spec:
      chart: goldilocks
      version: 11.1.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds-charts
        namespace: flux-system
  dependsOn:
    - name: envoy-gateway
      namespace: networking
  values:
    vpa:
      enabled: true
    dashboard:
      enabled: true
      replicaCount: 1
      # Exposed via httproute
      ingress:
        enabled: false
