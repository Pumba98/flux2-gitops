---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alloy
spec:
  groups:
    - name: alloy
      rules:
        - alert: AlloyAbsent
          annotations:
            description: Alloy has disappeared from Prometheus target discovery.
            summary: Alloy is down.
          expr: |
            absent(up{job=~".*alloy.*"} == 1)
          for: 5m
          labels:
            severity: critical
        - alert: AlloyRequestErrors
          annotations:
            description: Alloy {{ $labels.instance }} is experiencing {{ $value | humanizePercentage }} errors pushing to Loki.
            summary: Alloy request errors.
          expr: |
            100 * sum(rate(loki_write_request_duration_seconds_count{status_code=~"5..|failed"}[1m])) by (namespace, job, instance)
              /
            sum(rate(loki_write_request_duration_seconds_count[1m])) by (namespace, job, instance)
              > 10
          for: 15m
          labels:
            severity: critical
        - alert: AlloyRequestLatency
          annotations:
            description: Alloy {{ $labels.instance }} is experiencing {{ $value }}s 99th percentile latency pushing to Loki.
            summary: Alloy request high latency.
          expr: |
            histogram_quantile(0.99, sum(rate(loki_write_request_duration_seconds_bucket[5m])) by (le, namespace, job, instance))
              > 1
          for: 15m
          labels:
            severity: critical
        - alert: AlloyDroppedEntries
          annotations:
            description: Alloy {{ $labels.instance }} is dropping log entries that Loki refused to accept.
            summary: Alloy is dropping log entries.
          expr: |
            sum(rate(loki_write_dropped_entries_total[5m])) by (namespace, job, instance)
              > 0
          for: 15m
          labels:
            severity: warning
