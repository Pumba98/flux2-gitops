---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-exporter
spec:
  groups:
    - name: node-exporter
      rules:
        - alert: HostMemoryIsUnderutilized
          expr: 'min_over_time(node_memory_MemFree_bytes[1w]) > node_memory_MemTotal_bytes * .8'
          for: 0m
          labels:
            severity: info
          annotations:
            summary: Host Memory is underutilized (instance {{ $labels.instance }})
            description: "Node memory usage is < 20% for 1 week. Consider reducing memory space. (instance {{ $labels.instance }})\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostUnusualNetworkThroughputIn
          expr: '((rate(node_network_receive_bytes_total[5m]) / on(instance, device) node_network_speed_bytes) > .80)'
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Host unusual network throughput in (instance {{ $labels.instance }})
            description: "Host receive bandwidth is high (>80%).\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostUnusualNetworkThroughputOut
          expr: '((rate(node_network_transmit_bytes_total[5m]) / on(instance, device) node_network_speed_bytes) > .80)'
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Host unusual network throughput out (instance {{ $labels.instance }})
            description: "Host transmit bandwidth is high (>80%)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        # - alert: HostUnusualDiskReadRate
        #   expr: '(rate(node_disk_io_time_seconds_total[5m]) > .80)'
        #   for: 0m
        #   labels:
        #     severity: warning
        #   annotations:
        #     summary: Host unusual disk read rate (instance {{ $labels.instance }})
        #     description: "Disk is too busy (IO wait > 80%)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostFilesystemDeviceError
          expr: 'node_filesystem_device_error{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"} == 1'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Host filesystem device error (instance {{ $labels.instance }})
            description: "Error stat-ing the {{ $labels.mountpoint }} filesystem\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostCpuIsUnderutilized
          expr: '(min by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1h]))) > 0.8'
          for: 1w
          labels:
            severity: info
          annotations:
            summary: Host CPU is underutilized (instance {{ $labels.instance }})
            description: "CPU load has been < 20% for 1 week. Consider reducing the number of CPUs.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostCpuStealNoisyNeighbor
          expr: 'avg by(instance) (rate(node_cpu_seconds_total{mode="steal"}[5m])) * 100 > 15'
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Host CPU steal noisy neighbor (instance {{ $labels.instance }})
            description: "CPU steal is > 15%. A noisy neighbor is killing VM performances or a spot instance may be out of credit.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostSwapIsFillingUp
          expr: '((1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) * 100 > 80)'
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Host swap is filling up (instance {{ $labels.instance }})
            description: "Swap is filling up (>80%)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostNodeOvertemperatureAlarm
          expr: '((node_hwmon_temp_crit_alarm_celsius == 1) or (node_hwmon_temp_alarm == 1))'
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Host node overtemperature alarm (instance {{ $labels.instance }})
            description: "Physical node temperature alarm triggered\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostKernelVersionDeviations
          expr: 'changes(node_uname_info[1h]) > 0'
          for: 0m
          labels:
            severity: info
          annotations:
            summary: Host kernel version deviations (instance {{ $labels.instance }})
            description: "Kernel version for {{ $labels.instance }} has changed.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostOomKillDetected
          expr: |
            label_replace(
              max by (instance) (increase(node_vmstat_oom_kill[30m]))
              * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info),
              "node", "$1", "nodename", "(.*)"
            ) > 0
            unless on (node) max_over_time(node_namespace_pod_container:oom_killed:last10m[30m])
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Host OOM kill detected ({{ $labels.node }})
            description: "{{ printf \"%.0f\" $value }} process(es) OOM killed on {{ $labels.node }} in the last 30 minutes without a container OOMKilled termination: either node memory pressure or a child process killed inside a container that kept running. Check `talosctl -n {{ reReplaceAll \":.*\" \"\" $labels.instance }} dmesg | grep -i oom`."

        - alert: HostEdacCorrectableErrorsDetected
          expr: '(increase(node_edac_correctable_errors_total[1m]) > 0)'
          for: 0m
          labels:
            severity: info
          annotations:
            summary: Host EDAC Correctable Errors detected (instance {{ $labels.instance }})
            description: "Host {{ $labels.instance }} has had {{ printf \"%.0f\" $value }} correctable memory errors reported by EDAC in the last 5 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

        - alert: HostEdacUncorrectableErrorsDetected
          expr: '(node_edac_uncorrectable_errors_total > 0)'
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Host EDAC Uncorrectable Errors detected (instance {{ $labels.instance }})
            description: "Host {{ $labels.instance }} has had {{ printf \"%.0f\" $value }} uncorrectable memory errors reported by EDAC in the last 5 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
