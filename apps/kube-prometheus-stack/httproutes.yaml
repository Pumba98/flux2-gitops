---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  annotations:
    external-dns.alpha.kubernetes.io/target: "${SECRET_GATEWAY}"
spec:
  parentRefs:
  - name: internal
    namespace: networking
  - name: external
    namespace: networking
  hostnames:
  - "alert-manager.${SECRET_DOMAIN}"
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-alertmanager
      port: 9093
---
apiVersion: gateway.networking.k8s.io/v1
