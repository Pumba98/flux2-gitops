---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.22.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-charts
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    defaultRules:
      rules:
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverSlos: false
      disabled:
        CPUThrottlingHigh: true
    prometheus-node-exporter:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 512Mi
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        image:
          registry: quay.io
          repository: prometheus/alertmanager
          tag: v0.34.2
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        secrets:
          - alertmanager-discord
      # Exposed via httproutes.yaml
      ingress:
        enabled: false
      config:
        global:
          resolve_timeout: 5m
        receivers:
          - name: 'null'
          - name: 'discord'
            discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                avatar_url: https://avatars3.githubusercontent.com/u/3380462
                username: 'Prometheus'
                send_resolved: true
                # https://github.com/onedr0p/home-cluster/blob/main/cluster/apps/monitoring/kube-prometheus-stack/helm-release.yaml#L33
                title: |-
                  [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ if ne .CommonAnnotations.summary ""}}{{ .CommonAnnotations.summary }} {{ else if ne .CommonAnnotations.message ""}}{{ .CommonAnnotations.message }} {{ else if ne .CommonAnnotations.description ""}}{{ .CommonAnnotations.description }} {{ else }}{{ .CommonLabels.alertname }}{{ end }}
                message: >2-
                  {{ range .Alerts -}}
                    **Alert:** {{ .Annotations.title }}{{ if .Labels.severity }} `{{ .Labels.severity }}`{{ end }}
                  {{ if ne .Annotations.summary ""}}**Summary:** {{ .Annotations.summary }} {{ else if ne .Annotations.message ""}}**Message:** {{ .Annotations.message }} {{ else if ne .Annotations.description ""}}**Description:** {{ .Annotations.description }}{{ end }}
                    **Details:**
                    {{ range .Labels.SortedPairs }} • {{ .Name }}: `{{ .Value }}`
                    {{ end }}
                  {{ end }}
        route:
          group_by: ['...'] # ['alertname', 'job']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          receiver: 'discord'
          routes:
            - receiver: 'null'
              matchers:
                - severity =~ "none"
            - receiver: 'discord'
    grafana:
      enabled: true
      image:
        repository: grafana/grafana
        tag: 13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
      admin:
        existingSecret: grafana-secrets
      envFromSecret: grafana-secrets
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
        auth:
          disable_login_form: true
          oauth_auto_login: true
        # auth.anonymous:
        #   enabled: false
        # auth.basic:
        #   enabled: false
        auth.generic_oauth:
          enabled: true
          name: Authelia
          icon: signin
          client_id: wCDESryfxgaEQUrgISZWrcNgNQCCUL3u1PZulzpSTaRvkQTpN4CQvrWx6RTa69flzhonmC5p
          # client_secret:
          scopes: openid profile email groups
          empty_scopes: false
          auth_url: https://auth.${SECRET_DOMAIN}/api/oidc/authorization
          token_url: https://auth.${SECRET_DOMAIN}/api/oidc/token
          api_url: https://auth.${SECRET_DOMAIN}/api/oidc/userinfo
          login_attribute_path: preferred_username
          groups_attribute_path: groups
          name_attribute_path: name
          use_pkce: true
          role_attribute_path: contains(groups, 'admins') && 'GrafanaAdmin' || 'Viewer'
          allow_assign_grafana_admin: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          # # Ref: https://grafana.com/grafana/dashboards/13502
          # minio:
          #   gnetId: 13502
          #   revision: 10
          #   datasource: Prometheus
          flux-cluster:
            url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json
            datasource: Prometheus
          flux-control-plane:
            url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json
            datasource: Prometheus
          certificate-exporter:
            gnetId: 13922
            revision: 1
            datasource: Prometheus
          cert-manager:
            gnetId: 11001
            revision: 1
            datasource: Prometheus
          redis:
            gnetId: 11835
            revision: 1
            datasource: Prometheus
          postgresql:
            gnetId: 9628
            revision: 7
            datasource: Prometheus
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          initDashboards: true
          restartPolicy: Always
          startupProbe:
            httpGet:
              path: /healthz
              port: 8084
            periodSeconds: 5
            failureThreshold: 60
        datasources:
          enabled: true
          searchNamespace: ALL
          initDatasources: true
          restartPolicy: Always
          startupProbe:
            httpGet:
              path: /healthz
              port: 8082
            periodSeconds: 5
            failureThreshold: 60
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi
      resources:
        requests:
          cpu: 20m
          memory: 512Mi
        limits:
          memory: 2Gi
      serviceMonitor:
        enabled: true
      # Exposed via httproute
      ingress:
        enabled: false
    prometheus:
      # Exposed via httproute
      ingress:
        enabled: false
      prometheusSpec:
        image:
          registry: quay.io
          repository: prometheus/prometheus
          tag: v3.16.0-distroless
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        retention: 7d
        resources:
          requests:
            cpu: 70m
            memory: 2Gi
          limits:
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 25Gi
  # additionalScrapeConfigs:
  # - job_name: node-exporter
  #   honor_timestamps: true
  #   static_configs:
  #   - targets:
  #     - "192.168.1.10:9100"
  #     - "192.168.1.11:9100"
  #     - "192.168.1.15:9100"
  valuesFrom:
    - kind: ConfigMap
      name: flux-kube-state-metrics-config
      valuesKey: kube-state-metrics-config.yaml
