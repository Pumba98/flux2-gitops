---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weave-gitops
  annotations:
    external-dns.alpha.kubernetes.io/target: "${SECRET_GATEWAY}"
spec:
  parentRefs:
  - name: external
    namespace: networking
  hostnames:
  - "gitops.${SECRET_DOMAIN}"
  rules:
  - backendRefs:
    - name: weave-gitops
      port: 9001
