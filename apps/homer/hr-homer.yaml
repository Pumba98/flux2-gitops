---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homer
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/bastienwirtz/homer
              tag: v26.11.1@sha256:4f91088d51de94585d463f89e84bea18fd22ca5250202abfe8e7090ad1d1f0ac
              pullPolicy: IfNotPresent
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        annotations:
          external-dns.kubernetes.io/target: "${SECRET_GATEWAY}"
        hostnames:
          - "homer.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
          - name: external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: http
    persistence:
      config:
        type: configMap
        name: homer-config
        globalMounts:
          - path: "/www/assets/config.yml"
            subPath: config.yml
            readOnly: true
