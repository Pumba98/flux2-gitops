---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: seerr/seerr
              tag: v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /api/v1/status
              readiness:
                enabled: true
                type: HTTP
                path: /api/v1/status
              startup:
                enabled: true
                type: HTTP
                path: /api/v1/status
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      main:
        controller: main
        ports:
          http:
            port: 5055
    route:
      main:
        hostnames:
          - "seerr.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: http
    persistence:
      config:
        existingClaim: seerr-config
        globalMounts:
          - path: "/app/config"
