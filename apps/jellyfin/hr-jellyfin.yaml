---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  dependsOn:
    - name: envoy-gateway
      namespace: networking
    - name: csi-driver-smb
      namespace: kube-system
    - name: longhorn
      namespace: longhorn-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.2@sha256:c3efa69a22f2691fc88d6bb035e87a8560e395a6047f062fb381c61c3185e8f5
    service:
      main:
        controller: main
        ports:
          http:
            port: 8096
    route:
      main:
        hostnames:
        - "jellyfin.${SECRET_DOMAIN}"
        parentRefs:
        - name: internal
          namespace: networking
        rules:
        - backendRefs:
          - identifier: main
            port: http
    persistence:
      config:
        existingClaim: jellyfin-config
        globalMounts:
          - path: "/config"
      output:
        existingClaim: jellyfin-media
        globalMounts:
          - path: "/media"
      transcode:
        enabled: true
        type: emptyDir
        sizeLimit: 10Gi
        globalMounts:
          - path: /transcode
      cache:
        enabled: true
        type: emptyDir
        sizeLimit: 10Gi
        globalMounts:
          - path: /cache
