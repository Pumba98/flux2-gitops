---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/linuxserver/qbittorrent
              tag: 5.3.0@sha256:05c1454f9a32967affc1f34f67f8cc0cc57dd805dca45489fe797095a6286556
            env:
              WEBUI_PORT: 8080
              TORRENTING_PORT: 6881
            securityContext:
              runAsNonRoot: true
              runAsUser: 911
              runAsGroup: 911
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
          torrent:
            enabled: true
            port: 6881
            protocol: TCP
    route:
      main:
        hostnames:
          - "qb.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: http
    persistence:
      config:
        existingClaim: qbittorrent-config
        globalMounts:
          - path: "/config"
      downloads:
        existingClaim: qbittorrent-downloads
        globalMounts:
          - path: "/downloads"
