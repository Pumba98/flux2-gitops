---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  dependsOn:
    - name: envoy-gateway
      namespace: networking
    - name: csi-driver-smb
      namespace: kube-system
    - name: longhorn
      namespace: longhorn-system
    - name: pod-gateway-vpn
      namespace: networking
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/linuxserver/qbittorrent
              tag: 5.2.3@sha256:a00b6a597a3832a1814cde0ef60abc55c94644f3f80902c3432f6af6de8d4a96
            env:
              WEBUI_PORT: 8080
              TORRENTING_PORT: 6881
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
          torrent:
            enabled: true
            port: 6881
            protocol: TCP
    route:
      main:
        hostnames:
        - "qb.${SECRET_DOMAIN}"
        parentRefs:
        - name: internal
          namespace: networking
        rules:
        - backendRefs:
          - identifier: main
            port: http
    persistence:
      config:
        existingClaim: qbittorrent-config
        globalMounts:
          - path: "/config"
      downloads:
        existingClaim: qbittorrent-downloads
        globalMounts:
          - path: "/downloads"
