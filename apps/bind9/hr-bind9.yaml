---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bind9
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ubuntu/bind9
              tag: 9.20-26.04_stable@sha256:7fa4e6e4fa4430d9f080c4e2cbf8017d2136adae8dc8a3a70fd869dfa0e1ea38
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
        initContainers:
          create-zone:
            image:
              repository: alpine
              tag: 3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            command:
              - /bin/sh
              - -c
              - |
                [ "${CLUSTER_BIND9_ROLE}" = master ] || exit 0
                cp -n /tmp/*.zone /var/lib/bind/ && chown 101:101 /var/lib/bind/*.zone
            securityContext:
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      main:
        controller: main
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: "${LB_IP_BIND_SVC}"
        externalTrafficPolicy: Local
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP
    persistence:
      tsig:
        type: secret
        name: bind9-secrets
        globalMounts:
          - path: /etc/bind/tsig.keys
            subPath: tsig.keys
            readOnly: true
      config:
        type: configMap
        name: bind9-config
        globalMounts:
          - path: /etc/bind/named.conf
            subPath: named-${CLUSTER_BIND9_ROLE}.conf
            readOnly: true
          - path: /tmp/domain.zone
            subPath: domain.zone
            readOnly: true
          - path: /tmp/domain2.zone
            subPath: domain2.zone
            readOnly: true
      data:
        existingClaim: bind9-data
        globalMounts:
          - path: /var/lib/bind
      cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Mi
        globalMounts:
          - path: /var/cache/bind
