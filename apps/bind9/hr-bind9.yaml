---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bind9
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  dependsOn:
    - name: metallb
      namespace: metallb-system
    - name: longhorn
      namespace: longhorn-system
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ubuntu/bind9
              tag: 9.20-26.04_stable@sha256:84bbcf553e8da7d418b986f573bd88ae6a74a0692a2ce04c19e2af33218702ed
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
        initContainers:
          create-zone:
            image:
              repository: alpine
              tag: 3.24@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
            command:
              - /bin/sh
              - -c
              - |
                cp -n /tmp/*.zone /var/lib/bind/ && chown 101:101 /var/lib/bind/*.zone
            securityContext:
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      main:
        controller: main
        type: LoadBalancer
        loadBalancerIP: "${LB_IP_BIND_SVC}"
        externalTrafficPolicy: Local
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP
    persistence:
      config:
        type: secret
        name: bind9-secrets
        globalMounts:
          - path: /etc/bind/named.conf
            subPath: named-${CLUSTER_BIND9_ROLE}.conf
            readOnly: true
          - path: /etc/bind/tsig.keys
            subPath: tsig.keys
            readOnly: true
          - path: /tmp/domain.zone
            subPath: domain.zone
            readOnly: true
          - path: /tmp/domain2.zone
            subPath: domain2.zone
            readOnly: true
      data:
        existingClaim: bind9-data
        globalMounts:
          - path: /var/lib/bind
      cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Mi
        globalMounts:
          - path: /var/cache/bind
