include "/etc/bind/tsig.keys";

acl local {
    192.168.0.0/16;
    172.16.0.0/12;
    10.0.0.0/8;
};

// BIND 9.20 denies outgoing zone transfers unless allowed explicitly.
acl transfer {
    ${BIND_PEER_SOURCE}; // slave, arrives via the site gateway
    key external-dns-key;   // external-dns reads the zone with AXFR
};

options {
    directory "/var/cache/bind";
    recursion yes;
    forwarders {
        1.1.1.1;
        1.0.0.1;
        9.9.9.9;
    };
    dnssec-validation auto;
    listen-on-v6 { any; };
    allow-query { local; };
};

zone "${SECRET_DOMAIN}" IN {
    type master;
    file "/var/lib/bind/domain.zone";
    update-policy { grant external-dns-key zonesub any; grant terraform-key zonesub any; };
    allow-transfer { transfer; };
    also-notify { ${BIND_PEER_IP}; };
};

zone "${SECRET_DOMAIN2}" IN {
    type master;
    file "/var/lib/bind/domain2.zone";
    update-policy { grant external-dns-key zonesub any; grant terraform-key zonesub any; };
    allow-transfer { transfer; };
    also-notify { ${BIND_PEER_IP}; };
};
