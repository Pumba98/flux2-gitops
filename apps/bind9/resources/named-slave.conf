include "/etc/bind/tsig.keys";

acl local {
    192.168.0.0/16;
    172.16.0.0/12;
    10.0.0.0/8;
};

acl masters {
    192.168.100.201/32;
    192.168.100.202/32;
    192.168.100.203/32;
    192.168.100.204/32;
    192.168.100.205/32;
    192.168.100.206/32;
};

options {
    directory "/var/cache/bind";
    recursion yes;
    forwarders {
        1.1.1.1;
        1.0.0.1;
        9.9.9.9;
    };
    dnssec-validation auto;
    listen-on-v6 { any; };
    allow-query { local; };
};

zone "${SECRET_DOMAIN}" IN {
    type slave;
    file "/var/lib/bind/domain.zone";
    masterfile-format text;
    masters { 192.168.100.11; };
    allow-notify { masters; };
};

zone "${SECRET_DOMAIN2}" IN {
    type slave;
    file "/var/lib/bind/domain2.zone";
    masterfile-format text;
    masters { 192.168.100.11; };
    allow-notify { masters; };
};
