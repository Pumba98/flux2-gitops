include "/etc/bind/tsig.keys";

acl local {
    192.168.0.0/16;
    172.16.0.0/12;
    10.0.0.0/8;
};

acl masters {
    ${BIND_PEER_SOURCE};
};

options {
    directory "/var/cache/bind";
    recursion yes;
    forwarders {
        1.1.1.1;
        1.0.0.1;
        9.9.9.9;
    };
    dnssec-validation auto;
    listen-on-v6 { any; };
    allow-query { local; };
};

zone "${SECRET_DOMAIN}" IN {
    type slave;
    file "/var/lib/bind/domain.zone";
    masterfile-format text;
    masters { ${BIND_PEER_IP}; };
    allow-notify { masters; };
};

zone "${SECRET_DOMAIN2}" IN {
    type slave;
    file "/var/lib/bind/domain2.zone";
    masterfile-format text;
    masters { ${BIND_PEER_IP}; };
    allow-notify { masters; };
};
