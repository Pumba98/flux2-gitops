---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-static-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - uid=1000
    - gid=1000
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: garage-smb-volume
    volumeAttributes:
      source: "${SECRET_CIFS_SHARE}/garage"
    nodeStageSecretRef:
      name: smb-secrets
      namespace: kube-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-store
spec:
  volumeName: garage-static-pv
  storageClassName: smb
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: garage-meta
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: garage-meta
spec:
  repository:
    kind: ClusterRepository
    name: primary
  credentialProjection:
    enabled: true
  sources:
    - pvc:
        name: garage-meta
  retention:
    keepDaily: 7
    keepWeekly: 1
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: garage-meta
spec:
  policyRef:
    name: garage-meta
  schedule:
    cron: "0 6 * * *"
    runOnCreate: false
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: garage-meta
spec:
  repository:
    kind: ClusterRepository
    name: primary
  source:
    fromPolicy:
      name: garage-meta
  target:
    populator: {}
  credentialProjection:
    enabled: true
  policy:
    onMissingSnapshot: Continue
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
