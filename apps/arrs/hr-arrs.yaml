---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arrs
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/radarr
              tag: 6.4.4@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
            env:
              TZ: Etc/UTC
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: arrs-secrets
                    key: RADARR_API_KEY
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /ping
              readiness:
                enabled: true
                type: HTTP
                path: /ping
              startup:
                enabled: true
                type: HTTP
                path: /ping
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/sonarr
              tag: 4.0.20@sha256:c7d1df25e428da6c9ace05daea0d34e59522978a3843ea1944812f855af4086c
            env:
              TZ: Etc/UTC
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: arrs-secrets
                    key: SONARR_API_KEY
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /ping
              readiness:
                enabled: true
                type: HTTP
                path: /ping
              startup:
                enabled: true
                type: HTTP
                path: /ping
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
      bazarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/bazarr
              tag: 1.6.2@sha256:832820dec70bce9e912c6eee7a95baf6551e03dbc63325a7208daaa455423752
            env:
              TZ: Etc/UTC
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /api/system/ping
              readiness:
                enabled: true
                type: HTTP
                path: /api/system/ping
              startup:
                enabled: true
                type: HTTP
                path: /api/system/ping
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
      prowlarr:
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/prowlarr
              tag: 2.7.0@sha256:6660787a99b2e58203539583663c973b48979fc00ff2cb78dc0ea17429e1f6ef
            env:
              TZ: Etc/UTC
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /ping
              readiness:
                enabled: true
                type: HTTP
                path: /ping
              startup:
                enabled: true
                type: HTTP
                path: /ping
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
      flaresolverr:
        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
              readiness:
                enabled: true
                type: HTTP
                path: /health
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      radarr:
        controller: radarr
        ports:
          http:
            port: 7878
      sonarr:
        controller: sonarr
        ports:
          http:
            port: 8989
      bazarr:
        controller: bazarr
        ports:
          http:
            port: 6767
      prowlarr:
        controller: prowlarr
        ports:
          http:
            port: 9696
      flaresolverr:
        controller: flaresolverr
        ports:
          http:
            port: 8191
    route:
      radarr:
        hostnames:
          - "radarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: radarr
                port: http
            timeouts:
              request: 120s
      sonarr:
        hostnames:
          - "sonarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: sonarr
                port: http
            timeouts:
              request: 120s
      bazarr:
        hostnames:
          - "bazarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: bazarr
                port: http
      prowlarr:
        hostnames:
          - "prowlarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: prowlarr
                port: http
    persistence:
      media:
        existingClaim: arrs-media
        advancedMounts:
          radarr:
            app:
              - path: "/movies"
                subPath: movies
          sonarr:
            app:
              - path: "/tv"
                subPath: tv
          bazarr:
            app:
              - path: "/movies"
                subPath: movies
              - path: "/tv"
                subPath: tv
      downloads:
        existingClaim: arrs-downloads
        advancedMounts:
          radarr:
            app:
              - path: "/downloads"
                subPath: ""
          sonarr:
            app:
              - path: "/downloads"
                subPath: ""
      radarr:
        existingClaim: radarr-data
        advancedMounts:
          radarr:
            app:
              - path: "/config"
      sonarr:
        existingClaim: sonarr-data
        advancedMounts:
          sonarr:
            app:
              - path: "/config"
      bazarr:
        existingClaim: bazarr-data
        advancedMounts:
          bazarr:
            app:
              - path: "/config"
      prowlarr:
        existingClaim: prowlarr-data
        advancedMounts:
          prowlarr:
            app:
              - path: "/config"
