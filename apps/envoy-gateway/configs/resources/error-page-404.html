<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 &mdash; Not Found</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9;
      color: #1c1e21;
    }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    .code { font-size: 4rem; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0.5rem 0 0.75rem; }
    p { margin: 0; line-height: 1.6; color: #5c6470; }
    @media (prefers-color-scheme: dark) {
      body { background: #16181c; color: #e8eaed; }
      p { color: #9aa3af; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Not Found</h1>
    <p>We couldn&rsquo;t find anything at this address.</p>
  </main>
</body>
</html>
