---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: certificate-exporter
spec:
  interval: 5m
  chart:
    spec:
      chart: x509-certificate-exporter
      version: 4.2.4
      sourceRef:
        kind: HelmRepository
        name: enix-charts
        namespace: flux-system
  values:
    # talos
    secretsExporter:
      resources:
        limits:
          cpu: null
    hostPathsExporter:
      daemonSets:
        cp:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - effect: NoSchedule
              operator: Exists
            - effect: NoExecute
              operator: Exists
          watchFiles:
            - /etc/kubernetes/pki/ca.crt
            - /var/lib/kubelet/pki/kubelet-client-current.pem
        workers:
          watchFiles:
            - /etc/kubernetes/pki/ca.crt
            - /var/lib/kubelet/pki/kubelet-client-current.pem
      resources:
        limits:
          cpu: null
