---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 5m
  chart:
    spec:
      chart: reloader
      version: 2.2.18
      sourceRef:
        kind: HelmRepository
        name: stakater-charts
        namespace: flux-system
  values:
    reloader:
      # podMonitor:
      #   enabled: true
      reloadStrategy: annotations
      deployment:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 384Mi
