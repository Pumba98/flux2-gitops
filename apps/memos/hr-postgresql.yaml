---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos-postgresql
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      primary:
        type: statefulset
        # initContainers:
        #   # Init Container for Major PostgreSQL Upgrades, not needed permanently
        #   pgautoupgrade:
        #     image:
        #       repository: pgautoupgrade/pgautoupgrade
        #       tag: 18-trixie
        #     env:
        #       PGAUTO_ONESHOT: "yes"
        #       POSTGRES_DB: memos
        #       POSTGRES_PASSWORD: {valueFrom: {secretKeyRef: {name: memos-secrets, key: DB_PASSWORD}}}
        containers:
          postgresql:
            image:
              repository: public.ecr.aws/docker/library/postgres
              tag: 19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
            env:
              POSTGRES_DB: memos
              POSTGRES_USER: memos
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: memos-secrets
                    key: DB_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 750m
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                port: 5432
              readiness:
                enabled: true
                port: 5432
          metrics:
            image:
              repository: quay.io/prometheuscommunity/postgres-exporter
              tag: v0.21.1@sha256:a88794758ad461c75f3825b51cde4bde730bdff04b3b24d00efe14217e41f615
            env:
              DATA_SOURCE_URI: localhost:5432/postgres?sslmode=disable
              DATA_SOURCE_USER: memos
              DATA_SOURCE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: memos-secrets
                    key: DB_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 150m
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                port: 9187
              readiness:
                enabled: true
                port: 9187
    service:
      primary:
        controller: primary
        ports:
          postgresql:
            port: 5432
      metrics:
        controller: primary
        ports:
          metrics:
            port: 9187
    persistence:
      data:
        existingClaim: memos-postgresql
        globalMounts:
          - path: /var/lib/postgresql
            subPath: data
    serviceMonitor:
      main:
        enabled: true
        serviceName: memos-postgresql-metrics
        endpoints:
          - port: metrics
