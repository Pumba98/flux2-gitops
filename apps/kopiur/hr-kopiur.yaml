---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 5m
  chart:
    spec:
      chart: kopiur
      version: 0.10.12
      sourceRef:
        kind: HelmRepository
        name: home-operations-charts
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    installScope: cluster
    features:
      credentialProjection:
        enabled: true
    webhook:
      tls:
        mode: self
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
