---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-postgresql
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      primary:
        type: statefulset
        # initContainers:
        #   # Init Container for Major PostgreSQL Upgrades, not needed permanently
        #   pgautoupgrade:
        #     image:
        #       repository: pgautoupgrade/pgautoupgrade
        #       tag: 18-trixie
        #     # securityContext:
        #     #   runAsUser: 0
        #     #   runAsGroup: 0
        #     env:
        #       PGAUTO_ONESHOT: "yes"
        #       POSTGRES_DB: paperless-ngx
        #       POSTGRES_PASSWORD: {valueFrom: {secretKeyRef: {name: paperless-ngx-secrets, key: DB_PASSWORD}}}
        containers:
          postgresql:
            image:
              repository: public.ecr.aws/docker/library/postgres
              tag: 18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
            env:
              POSTGRES_DB: paperless-ngx
              POSTGRES_USER: paperless-ngx
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secrets
                    key: DB_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 750m
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                port: 5432
              readiness:
                enabled: true
                port: 5432
          metrics:
            image:
              repository: quay.io/prometheuscommunity/postgres-exporter
              tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
            env:
              DATA_SOURCE_URI: localhost:5432/postgres?sslmode=disable
              DATA_SOURCE_USER: paperless-ngx
              DATA_SOURCE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secrets
                    key: DB_PASSWORD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 150m
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                port: 9187
              readiness:
                enabled: true
                port: 9187
    service:
      primary:
        controller: primary
        ports:
          postgresql:
            port: 5432
      metrics:
        controller: primary
        ports:
          metrics:
            port: 9187
    persistence:
      data:
        existingClaim: paperless-ngx-postgresql
        globalMounts:
          - path: /var/lib/postgresql
            subPath: data
    serviceMonitor:
      main:
        enabled: true
        serviceName: paperless-ngx-postgresql-metrics
        endpoints:
          - port: metrics
