---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-postgresql
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 5m
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
    - name: longhorn
      namespace: longhorn-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      primary:
        type: statefulset
        # initContainers:
        #   # Init Container for Major PostgreSQL Upgrades, not needed permanently
        #   pgautoupgrade:
        #     image:
        #       repository: pgautoupgrade/pgautoupgrade
        #       tag: 18-trixie
        #     # securityContext:
        #     #   runAsUser: 0
        #     #   runAsGroup: 0
        #     env:
        #       PGAUTO_ONESHOT: "yes"
        #       POSTGRES_DB: paperless-ngx
        #       POSTGRES_PASSWORD: ${SECRET_PAPERLESS_NGX_DB_PASSWORD}
        containers:
          postgresql:
            image:
              repository: public.ecr.aws/docker/library/postgres
              tag: 18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
            env:
              POSTGRES_DB: paperless-ngx
              POSTGRES_USER: paperless-ngx
              POSTGRES_PASSWORD: ${SECRET_PAPERLESS_NGX_DB_PASSWORD}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 750m
                memory: 768Mi
            probes:
              liveness:
                enabled: true
                port: 5432
              readiness:
                enabled: true
                port: 5432
          metrics:
            image:
              repository: quay.io/prometheuscommunity/postgres-exporter
              tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
            env:
              DATA_SOURCE_URI: localhost:5432/postgres?sslmode=disable
              DATA_SOURCE_USER: paperless-ngx
              DATA_SOURCE_PASS: ${SECRET_PAPERLESS_NGX_DB_PASSWORD}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 150m
                memory: 192Mi
            probes:
              liveness:
                enabled: true
                port: 9187
              readiness:
                enabled: true
                port: 9187
    service:
      primary:
        controller: primary
        ports:
          postgresql:
            port: 5432
      metrics:
        controller: primary
        ports:
          metrics:
            port: 9187
    persistence:
      data:
        existingClaim: paperless-ngx-postgresql
        globalMounts:
        - path: /var/lib/postgresql
          subPath: data
    serviceMonitor:
      main:
        enabled: true
        serviceName: paperless-ngx-postgresql-metrics
        endpoints:
          - port: metrics
