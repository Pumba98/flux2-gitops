---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ngx-postgresql
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-backup
  accessModes:
  - ReadWriteOnce
  # dataSourceRef:
  #   apiGroup: kopiur.home-operations.com
  #   kind: Restore
  #   name: paperless-ngx-postgresql
  resources:
    requests:
      storage: 256Mi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: paperless-ngx-postgresql
spec:
  repository:
    kind: ClusterRepository
    name: primary
  credentialProjection:
    enabled: true
  sources:
  - pvc:
      name: paperless-ngx-postgresql
  retention:
    keepDaily: 7
    keepWeekly: 1
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
    podSecurityContext:
      fsGroup: 999
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: paperless-ngx-postgresql
spec:
  policyRef:
    name: paperless-ngx-postgresql
  schedule:
    cron: "30 5 * * *"
    runOnCreate: false
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: paperless-ngx-postgresql
spec:
  repository:
    kind: ClusterRepository
    name: primary
  source:
    fromPolicy:
      name: paperless-ngx-postgresql
  target:
    populator: {}
  credentialProjection:
    enabled: true
  policy:
    onMissingSnapshot: Continue
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
    podSecurityContext:
      fsGroup: 999
