---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radicale
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-backup
  accessModes:
  - ReadWriteOnce
  # dataSourceRef:
  #   apiGroup: kopiur.home-operations.com
  #   kind: Restore
  #   name: radicale
  resources:
    requests:
      storage: 64Mi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: radicale
spec:
  repository:
    kind: ClusterRepository
    name: primary
  credentialProjection:
    enabled: true
  sources:
  - pvc:
      name: radicale
  retention:
    keepDaily: 7
    keepWeekly: 1
  mover:
    securityContext:
      runAsUser: 2999
      runAsGroup: 2999
    podSecurityContext:
      fsGroup: 2999
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: radicale
spec:
  policyRef:
    name: radicale
  schedule:
    cron: "30 6 * * *"
    runOnCreate: false
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: radicale
spec:
  repository:
    kind: ClusterRepository
    name: primary
  source:
    fromPolicy:
      name: radicale
  target:
    populator: {}
  credentialProjection:
    enabled: true
  policy:
    onMissingSnapshot: Continue
  mover:
    securityContext:
      runAsUser: 2999
      runAsGroup: 2999
    podSecurityContext:
      fsGroup: 2999
