---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radicale
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: tomsquest/docker-radicale
              tag: 3.9.2.0@sha256:cc586f75ec709d45d15dfbf20e53bab99e85ee5a4d7beafc7bbf852b2f07a2da
            securityContext:
              runAsNonRoot: true
              runAsUser: 2999
              runAsGroup: 2999
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 5232
    route:
      main:
        hostnames:
          - "radicale.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: networking
          - name: external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: http
    persistence:
      config:
        type: configMap
        name: radicale-config
        globalMounts:
          - path: /config/config
            subPath: config.cfg
            readOnly: true
      auth:
        type: secret
        name: radicale-secrets
        globalMounts:
          - path: /config/users
            subPath: users
            readOnly: true
      data:
        existingClaim: radicale
        globalMounts:
          - path: /data
